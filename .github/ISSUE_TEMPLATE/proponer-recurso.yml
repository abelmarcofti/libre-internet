name: Proponer recurso
description: Sugiere un recurso libre para la biblioteca
title: "[Recurso] "
labels: ["recurso-propuesto"]
body:
  - type: input
    id: titulo
    attributes:
      label: Título
    validations:
      required: true
  - type: input
    id: autor
    attributes:
      label: Autor
      description: Persona o entidad
    validations:
      required: true
  - type: dropdown
    id: idioma
    attributes:
      label: Idioma
      options: [ca, es, en, de, ja, ru, fr, pt, it, gl, eu, nl, pl, zh, ar]
    validations:
      required: true
  - type: input
    id: tipo
    attributes:
      label: Tipo
      description: "Solo letras: libro, manual, curso..."
    validations:
      required: true
  - type: dropdown
    id: licencia
    attributes:
      label: Licencia
      options: [Public-Domain, CC0-1.0, CC-BY-4.0, CC-BY-SA-4.0, MIT, Apache-2.0, GPL-3.0, GFDL-1.3, Dominio Público, No aplica, N/D]
    validations:
      required: true
  - type: input
    id: enlace
    attributes:
      label: Enlace
      description: Debe empezar por https://
    validations:
      required: true
  - type: input
    id: etiquetas
    attributes:
      label: Etiquetas
      description: Separadas por comas, por ejemplo linux, redes
    validations:
      required: true
  - type: checkboxes
    id: confirmacion
    attributes:
      label: Confirmación
      options:
        - label: He comprobado que el recurso tiene una licencia libre o es de dominio público
          required: true
